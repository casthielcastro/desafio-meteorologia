<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
<title id="title">Média e mediana: efeito de alterar o maior valor</title>
<desc id="desc">Duas sequências ordenadas de cinco velocidades. Ao trocar 34 por 100, a média passa de 12 a 25,2 km/h; a mediana permanece 6 km/h, na terceira posição.</desc>
<rect width="1040" height="520" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243344">
<text x="44" y="44" font-size="25" font-weight="bold">Velocidades do vento (km/h)</text>
<text x="44" y="71" font-size="17" fill="#526173">Exemplos fictícios • valores em ordem crescente</text>
<text x="44" y="111" font-size="17" font-weight="bold">Exemplo 1</text>
<text x="44" y="299" font-size="17" font-weight="bold">Exemplo 2</text>
<rect x="44" y="125" width="82" height="58" rx="6" fill="#f5f6f7" stroke="#c4cbd1" stroke-width="1"/><text x="85" y="162" font-size="25" font-weight="normal" text-anchor="middle" fill="#243344">4</text><rect x="144" y="125" width="82" height="58" rx="6" fill="#f5f6f7" stroke="#c4cbd1" stroke-width="1"/><text x="185" y="162" font-size="25" font-weight="normal" text-anchor="middle" fill="#243344">6</text><rect x="244" y="125" width="82" height="58" rx="6" fill="#e4f0fa" stroke="#2866a1" stroke-width="2"/><text x="285" y="162" font-size="25" font-weight="bold" text-anchor="middle" fill="#235d94">6</text><rect x="344" y="125" width="82" height="58" rx="6" fill="#f5f6f7" stroke="#c4cbd1" stroke-width="1"/><text x="385" y="162" font-size="25" font-weight="normal" text-anchor="middle" fill="#243344">10</text><rect x="444" y="125" width="82" height="58" rx="6" fill="#fff0df" stroke="#b97024" stroke-width="2"/><text x="485" y="162" font-size="25" font-weight="bold" text-anchor="middle" fill="#955110">34</text><g fill="none" stroke="#82909d" stroke-width="1.5"><path d="M85 190 v8 H185 v-8"/><path d="M385 190 v8 H485 v-8"/></g><g text-anchor="middle" font-size="14" fill="#526173"><text x="135" y="219">2 valores</text><text x="435" y="219">2 valores</text></g><path d="M285 186 V214" stroke="#2866a1" stroke-width="2"/><text x="285" y="235" text-anchor="middle" fill="#235d94" font-size="16" font-weight="bold">Mediana = 6</text><text x="590" y="143" font-size="17" fill="#526173">Média</text><text x="590" y="173" font-size="20">(4 + 6 + 6 + 10 + 34) ÷ 5</text><text x="590" y="214" font-size="31" font-weight="bold" fill="#243344">= 12 km/h</text><rect x="44" y="313" width="82" height="58" rx="6" fill="#f5f6f7" stroke="#c4cbd1" stroke-width="1"/><text x="85" y="350" font-size="25" font-weight="normal" text-anchor="middle" fill="#243344">4</text><rect x="144" y="313" width="82" height="58" rx="6" fill="#f5f6f7" stroke="#c4cbd1" stroke-width="1"/><text x="185" y="350" font-size="25" font-weight="normal" text-anchor="middle" fill="#243344">6</text><rect x="244" y="313" width="82" height="58" rx="6" fill="#e4f0fa" stroke="#2866a1" stroke-width="2"/><text x="285" y="350" font-size="25" font-weight="bold" text-anchor="middle" fill="#235d94">6</text><rect x="344" y="313" width="82" height="58" rx="6" fill="#f5f6f7" stroke="#c4cbd1" stroke-width="1"/><text x="385" y="350" font-size="25" font-weight="normal" text-anchor="middle" fill="#243344">10</text><rect x="444" y="313" width="82" height="58" rx="6" fill="#fff0df" stroke="#b97024" stroke-width="2"/><text x="485" y="350" font-size="25" font-weight="bold" text-anchor="middle" fill="#955110">100</text><g fill="none" stroke="#82909d" stroke-width="1.5"><path d="M85 378 v8 H185 v-8"/><path d="M385 378 v8 H485 v-8"/></g><g text-anchor="middle" font-size="14" fill="#526173"><text x="135" y="407">2 valores</text><text x="435" y="407">2 valores</text></g><path d="M285 374 V402" stroke="#2866a1" stroke-width="2"/><text x="285" y="423" text-anchor="middle" fill="#235d94" font-size="16" font-weight="bold">Mediana = 6</text><text x="590" y="331" font-size="17" fill="#526173">Média</text><text x="590" y="361" font-size="20">(4 + 6 + 6 + 10 + 100) ÷ 5</text><text x="590" y="402" font-size="31" font-weight="bold" fill="#955110">= 25,2 km/h</text>
<path d="M44 267 H996" stroke="#d7dde2"/>
<path d="M44 459 H996" stroke="#d7dde2"/>
<text x="44" y="490" font-size="19" font-weight="bold">A média aumentou. A posição central não mudou.</text>
</g></svg>